{
  "schema_version": "1.0",
  "registry_version": "2026-08-11",
  "format_note": "This file uses JSON syntax, which is valid YAML 1.2, so validation requires no YAML dependency.",
  "global_constraints": {
    "preserve_units": true,
    "deterministic_arithmetic_required": true,
    "organizational_agreement_weight": 0,
    "new_dates_symbols_or_anchors_prohibited": true,
    "required_fields": ["textual_basis", "assumptions", "interpretive_school", "counter_readings", "review_status", "confidence"]
  },
  "rules": [
    {
      "rule_id": "PR-001",
      "name": "Forty-two months and 1,260 days",
      "evidence_class": "canonical_synthesis",
      "textual_basis": ["Revelation 11:2-3", "Revelation 12:6", "Revelation 13:5"],
      "formula": "42 * 30 = 1260",
      "test_vectors": ["42 * 30 = 1260"],
      "input_unit": "months",
      "output_unit": "days",
      "assumptions": ["The compared apocalyptic durations use schematic thirty-day months.", "The passages are contextually parallel enough for comparison."],
      "interpretive_school": "cross-school textual comparison",
      "counter_readings": ["The periods may be symbolic without requiring a universal prophetic calendar.", "Parallel wording does not by itself settle every referent or fulfillment."],
      "review_status": "candidate",
      "confidence": "moderate",
      "allow_new_anchor": false
    },
    {
      "rule_id": "PR-002",
      "name": "Time, times, and half a time",
      "evidence_class": "canonical_synthesis",
      "textual_basis": ["Daniel 7:25", "Daniel 12:7", "Revelation 12:14"],
      "formula": "3.5 * 360 = 1260",
      "test_vectors": ["3.5 * 360 = 1260"],
      "input_unit": "schematic_years",
      "output_unit": "days",
      "assumptions": ["Time plus times plus half a time denotes three and one-half periods.", "Each schematic year is represented as 360 days.", "The Daniel and Revelation passages are legitimate canonical parallels."],
      "interpretive_school": "apocalyptic duration synthesis",
      "counter_readings": ["Time may denote an indefinite period in some contexts.", "The 360-day conversion is a schematic inference rather than a rule explicitly stated for every prophecy."],
      "review_status": "candidate",
      "confidence": "moderate",
      "allow_new_anchor": false
    },
    {
      "rule_id": "PR-003",
      "name": "Day-for-year precedents",
      "evidence_class": "contextual_inference",
      "textual_basis": ["Numbers 14:34", "Ezekiel 4:4-6"],
      "formula": "symbolic_days * 1 = represented_years",
      "test_vectors": ["1 * 1 = 1", "1260 * 1 = 1260"],
      "input_unit": "symbolic_days",
      "output_unit": "represented_years",
      "assumptions": ["The acted-symbol precedents may inform a separately reviewed apocalyptic passage.", "The target passage provides contextual warrant for symbolic conversion."],
      "interpretive_school": "historicist when generalized to apocalyptic timelines",
      "counter_readings": ["Both source passages explicitly define their own symbolism and do not state a universal conversion law.", "Preterist, futurist, and idealist readings may retain literal days or treat the period symbolically without historical-year conversion."],
      "review_status": "disputed",
      "confidence": "low",
      "allow_new_anchor": false
    },
    {
      "rule_id": "PR-004",
      "name": "Times as year-like periods in Daniel 4",
      "evidence_class": "named_historical_interpretation",
      "textual_basis": ["Daniel 4:16", "Daniel 4:23", "Daniel 4:25", "Daniel 4:32"],
      "formula": "7 * 1 = 7",
      "test_vectors": ["7 * 1 = 7"],
      "input_unit": "times",
      "output_unit": "year_like_periods",
      "assumptions": ["The Aramaic term iddan in this narrative denotes annual or year-like periods.", "Narrative usage may be compared with apocalyptic usage only after genre and context review."],
      "interpretive_school": "traditional year-reading of Daniel 4",
      "counter_readings": ["The Aramaic text says times or periods rather than explicitly saying years.", "Narrative duration in Daniel 4 does not automatically define the term in every apocalyptic context."],
      "review_status": "disputed",
      "confidence": "low",
      "allow_new_anchor": false
    },
    {
      "rule_id": "PR-005",
      "name": "Historicist 1,260-year application",
      "evidence_class": "named_historical_interpretation",
      "textual_basis": ["Daniel 7:25", "Revelation 11:2-3", "Revelation 12:6", "Revelation 12:14", "Revelation 13:5"],
      "formula": "1260 * 1 = 1260",
      "test_vectors": ["1260 * 1 = 1260"],
      "input_unit": "symbolic_days",
      "output_unit": "historical_years",
      "assumptions": ["PR-001 or PR-002 establishes a 1,260-day symbolic duration.", "PR-003 is applicable to the target prophecy.", "Any start and end anchors are separately sourced, independently reviewed historical claims."],
      "interpretive_school": "historicist",
      "counter_readings": ["Preterist readings locate primary fulfillment in the ancient or first-century setting.", "Futurist readings may treat the period as a future three and one-half years.", "Idealist readings may treat the duration as symbolic of a limited period without calendar conversion."],
      "review_status": "disputed",
      "confidence": "low",
      "allow_new_anchor": false
    }
  ]
}
